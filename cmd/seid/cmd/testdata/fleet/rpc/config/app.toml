minimum-gas-prices = "0.01usei"
pruning = "custom"
pruning-keep-recent = "86400"
pruning-keep-every = "500"
pruning-interval = "10"
halt-height = 0
halt-time = 0
min-retain-blocks = 100000
inter-block-cache = true
iavl-disable-fastnode = true
compaction-interval = 0
concurrency-workers = 500
occ-enabled = true

[telemetry]
  service-name = ""
  enabled = true
  enable-hostname = false
  enable-hostname-label = false
  enable-service-label = false
  prometheus-retention-time = 7200
  global-labels = []

[api]
  enable = true
  swagger = true
  address = "tcp://0.0.0.0:1317"
  max-open-connections = 1000
  rpc-read-timeout = 10
  rpc-write-timeout = 0
  rpc-max-body-bytes = 1000000
  enabled-unsafe-cors = false

[grpc]
  enable = true
  address = "0.0.0.0:9090"

[grpc-web]
  enable = true
  address = "0.0.0.0:9091"
  enable-unsafe-cors = false

[state-sync]
  snapshot-interval = 0
  snapshot-keep-recent = 2
  snapshot-directory = ""

[state-commit]
  sc-enable = true
  sc-directory = ""
  sc-async-commit-buffer = 100
  sc-keep-recent = 0
  sc-snapshot-interval = 0
  sc-snapshot-min-time-interval = 0
  sc-snapshot-writer-limit = 0
  sc-snapshot-prefetch-threshold = 0.0

[state-store]
  ss-enable = true
  ss-db-directory = ""
  ss-backend = "pebbledb"
  ss-async-write-buffer = 100
  ss-keep-recent = 100000
  ss-prune-interval = 600
  ss-import-num-workers = 1
  ss-keep-last-version = true
  ss-use-default-comparer = false
  ss-evm-db-directory = ""

[receipt-store]
  rs-backend = "pebbledb"
  db-directory = ""
  async-write-buffer = 100
  keep-recent = 100000
  prune-interval-seconds = 600
  tx-index-backend = "pebbledb"

[evm]
  http_enabled = true
  http_port = 8545
  ws_enabled = true
  ws_port = 8546
  read_timeout = "30s"
  read_header_timeout = "30s"
  write_timeout = "30s"
  idle_timeout = "2m0s"
  simulation_gas_limit = 10000000
  simulation_evm_timeout = "1m0s"
  cors_origins = "*"
  ws_origins = "*"
  filter_timeout = "2m0s"
  checktx_timeout = "5s"
  max_tx_pool_txs = 1000
  slow = false
  deny_list = []
  enabled_legacy_sei_apis = []
  max_log_no_block = 10000
  max_blocks_for_log = 2000
  max_subscriptions_new_head = 10000
  enable_test_api = false
  max_concurrent_trace_calls = 10
  max_concurrent_simulation_calls = 64
  max_trace_lookback_blocks = 10000
  trace_timeout = "30s"
  rpc_stats_interval = "10s"
  worker_pool_size = 64
  worker_queue_size = 1000

[wasm]
  query_gas_limit = 300000
  lru_size = 1

[giga_executor]
  enabled = true
  occ_enabled = true

[eth_replay]
  eth_replay_enabled = false
  eth_rpc = "http://44.234.105.54:18545"
  eth_data_dir = "/root/.ethereum/chaindata"
  eth_replay_contract_state_checks = false

[eth_block_test]
  eth_block_test_enabled = false
  eth_block_test_test_data_path = "~/testdata/"

[evm_query]
  evm_query_gas_limit = 300000

[light_invariance]
  supply_enabled = true

[genesis]
  stream-import = false
  genesis-stream-file = ""

[sei]
  mode = "full"
  version = 2
